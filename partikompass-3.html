function PartiKompass() {
  const [selectedTopic, setSelectedTopic] = useState("nuclear");
  const [selectedParty, setSelectedParty] = useState(null);
  const [view, setView] = useState("grid");

  const topic = allTopics.find(t => t.id === selectedTopic);
  const party = parties.find(p => p.id === selectedParty);

  return (
    <div style={{ minHeight: "100vh", background: "#0f0f13", color: "#f0ede8", fontFamily: "'Georgia', 'Times New Roman', serif" }}>
      {/* Header */}
      <div style={{ borderBottom: "1px solid #2a2a35", padding: "28px 24px 20px", background: "linear-gradient(180deg, #16161f 0%, #0f0f13 100%)" }}>
        <div style={{ maxWidth: 940, margin: "0 auto" }}>
          <div style={{ fontSize: 11, letterSpacing: "0.2em", color: "#666", textTransform: "uppercase", fontFamily: "sans-serif", marginBottom: 6 }}>Inför valet 2026</div>
          <h1 style={{ margin: 0, fontSize: "clamp(22px, 4vw, 36px)", fontWeight: "normal", letterSpacing: "-0.02em", lineHeight: 1.1 }}>
            Riksdagspartiernas<br /><span style={{ color: "#9b8cff" }}>sakpolitiska ståndpunkter</span>
          </h1>
          <p style={{ margin: "10px 0 0", color: "#888", fontSize: 13, fontFamily: "sans-serif" }}>10 teman · 8 partier · Klicka för att läsa mer</p>
        </div>
      </div>

      <div style={{ maxWidth: 940, margin: "0 auto", padding: "20px 16px" }}>
        {/* Topic groups */}
        {topicGroups.map(group => (
          <div key={group.label} style={{ marginBottom: 14 }}>
            <div style={{ fontSize: 10, letterSpacing: "0.18em", textTransform: "uppercase", color: "#555", fontFamily: "sans-serif", marginBottom: 7 }}>{group.label}</div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {group.topics.map(t => (
                <button key={t.id} onClick={() => { setSelectedTopic(t.id); setSelectedParty(null); setView("grid"); }}
                  style={{ padding: "7px 13px", borderRadius: 6, border: selectedTopic === t.id ? "1px solid #9b8cff" : "1px solid #2a2a35", background: selectedTopic === t.id ? "#1e1a3a" : "transparent", color: selectedTopic === t.id ? "#c4b8ff" : "#888", cursor: "pointer", fontSize: 12, fontFamily: "sans-serif", transition: "all 0.15s" }}>
                  {t.label}
                </button>
              ))}
            </div>
          </div>
        ))}

        <div style={{ borderTop: "1px solid #1e1e28", margin: "16px 0 22px" }} />

        {/* Back */}
        {view === "detail" && party && (
          <button onClick={() => { setSelectedParty(null); setView("grid"); }}
            style={{ display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", color: "#9b8cff", cursor: "pointer", fontSize: 13, fontFamily: "sans-serif", marginBottom: 20, padding: 0 }}>
            ← Tillbaka till översikt
          </button>
        )}

        {/* Detail view */}
        {view === "detail" && party && (
          <div>
            <div style={{ background: "#16161f", borderRadius: 12, border: "1px solid #2a2a35", overflow: "hidden", marginBottom: 22 }}>
              <div style={{ background: party.color, padding: "20px 24px", display: "flex", alignItems: "center", gap: 16 }}>
                <div style={{ width: 54, height: 54, borderRadius: "50%", background: "rgba(255,255,255,0.2)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 17, fontWeight: "bold", color: party.textColor, fontFamily: "sans-serif", flexShrink: 0 }}>{party.abbr}</div>
                <div>
                  <div style={{ color: party.textColor, fontSize: 19 }}>{party.name}</div>
                  <div style={{ color: party.textColor, opacity: 0.7, fontSize: 12, fontFamily: "sans-serif", marginTop: 2 }}>{party.bloc}</div>
                </div>
              </div>
              <div style={{ padding: "20px 24px" }}>
                <h3 style={{ margin: "0 0 10px", fontSize: 11, letterSpacing: "0.12em", textTransform: "uppercase", color: "#666", fontFamily: "sans-serif" }}>{topic.short}</h3>
                <div style={{ display: "flex", gap: 4, marginBottom: 6 }}>
                  {[1,2,3,4,5].map(i => (
                    <div key={i} style={{ height: 8, flex: 1, borderRadius: 4, background: i <= ratings[party.id][selectedTopic] ? ratingColors[ratings[party.id][selectedTopic]-1] : "#2a2a35" }} />
                  ))}
                </div>
                <div style={{ fontSize: 11, color: "#888", fontFamily: "sans-serif", marginBottom: 16 }}>{ratingLabels[selectedTopic][ratings[party.id][selectedTopic]-1]}</div>

                <button key={t.id} onClick={() => setSelectedTopic(t.id)}
                  style={{ background: "#16161f", border: "1px solid #2a2a35", borderRadius: 10, padding: "13px", textAlign: "left", cursor: "pointer" }}
                  onMouseEnter={e => e.currentTarget.style.borderColor = "#9b8cff"}
                  onMouseLeave={e => e.currentTarget.style.borderColor = "#2a2a35"}>
                  <div style={{ fontSize: 11, color: "#aaa", fontFamily: "sans-serif", marginBottom: 6 }}>{t.label}</div>
                  <div style={{ display: "flex", gap: 3 }}>
                    {[1,2,3,4,5].map(i => (
                      <div key={i} style={{ height: 5, flex: 1, borderRadius: 3, background: i <= ratings[party.id][t.id] ? ratingColors[ratings[party.id][t.id]-1] : "#2a2a35" }} />
                    ))}
                  </div>
                  <div style={{ fontSize: 10, color: "#555", marginTop: 4, fontFamily: "sans-serif" }}>{ratingLabels[t.id][ratings[party.id][t.id]-1]}</div>
                </button>
              ))}
            </div>
          </div>
        )}

        {/* Grid view */}
        {view === "grid" && (
          <>
            <p style={{ margin: "0 0 14px", fontSize: 12, color: "#666", fontFamily: "sans-serif" }}>Klicka på ett parti för att läsa hela ståndpunkten</p>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(196px, 1fr))", gap: 10 }}>
              {parties.map(p => {
                const r = ratings[p.id][selectedTopic];
                const color = ratingColors[r-1];
                return (
                  <button key={p.id} onClick={() => { setSelectedParty(p.id); setView("detail"); }}

                    <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 3, background: p.color }} />
                    <div style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", width: 36, height: 36, borderRadius: "50%", background: p.color, color: p.textColor, fontSize: 11, fontWeight: "bold", fontFamily: "sans-serif", marginBottom: 9 }}>{p.abbr}</div>
                    <div style={{ fontSize: 12, color: "#ccc", marginBottom: 2, fontFamily: "sans-serif" }}>{p.name}</div>
                    <div style={{ fontSize: 10, color: "#555", marginBottom: 11, fontFamily: "sans-serif" }}>{p.bloc}</div>
                    <div style={{ display: "flex", gap: 3, marginBottom: 5 }}>
                      {[1,2,3,4,5].map(i => (
                        <div key={i} style={{ height: 5, flex: 1, borderRadius: 3, background: i <= r ? color : "#2a2a35" }} />
                      ))}
                    </div>
                    <div style={{ fontSize: 10, color, fontFamily: "sans-serif", fontWeight: "600", marginBottom: 9 }}>{ratingLabels[selectedTopic][r-1]}</div>
                    <div style={{ fontSize: 11, color: "#666", lineHeight: 1.5, display: "-webkit-box", WebkitLineClamp: 3, WebkitBoxOrient: "vertical", overflow: "hidden", fontFamily: "sans-serif" }}>{positions[p.id][selectedTopic]}</div>
                    <div style={{ marginTop: 9, fontSize: 10, color: "#9b8cff", fontFamily: "sans-serif" }}>Läs mer →</div>
                  </button>
                );
              })}
            </div>

            {/* Legend */}
            <div style={{ marginTop: 26, padding: "15px", background: "#16161f", borderRadius: 10, border: "1px solid #2a2a35" }}>
              <div style={{ fontSize: 10, letterSpacing: "0.15em", textTransform: "uppercase", color: "#555", fontFamily: "sans-serif", marginBottom: 9 }}>Skala — {topic.short}</div>
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                {ratingLabels[selectedTopic].map((label, i) => (
                  <div key={i} style={{ display: "flex", alignItems: "center", gap: 5 }}>
                    <div style={{ width: 8, height: 8, borderRadius: 2, background: ratingColors[i], flexShrink: 0 }} />
                    <span style={{ fontSize: 11, color: "#777", fontFamily: "sans-serif" }}>{label}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Bar comparison */}
            <div style={{ marginTop: 20 }}>
              <h3 style={{ margin: "0 0 13px", fontSize: 11, letterSpacing: "0.12em", textTransform: "uppercase", color: "#555", fontFamily: "sans-serif" }}>Snabbvy — alla partier</h3>
              {parties.map(p => {
                const r = ratings[p.id][selectedTopic];
                return (
                  <div key={p.id} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 7, cursor: "pointer" }} onClick={() => { setSelectedParty(p.id); setView("detail"); }}>
                    <div style={{ width: 28, height: 28, borderRadius: "50%", background: p.color, color: p.textColor, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 9, fontWeight: "bold", fontFamily: "sans-serif", flexShrink: 0 }}>{p.abbr}</div>
                    <div style={{ flex: 1 }}>
                      <div style={{ display: "flex", gap: 2 }}>
                        {[1,2,3,4,5].map(i => (
                          <div key={i} style={{ height: 7, flex: 1, borderRadius: 2, background: i <= r ? ratingColors[r-1] : "#1e1e28" }} />
                        ))}
                      </div>
                    </div>
                    <div style={{ fontSize: 10, color: "#555", fontFamily: "sans-serif", width: 130, textAlign: "right" }}>{ratingLabels[selectedTopic][r-1]}</div>
                  </div>
                );
              })}
            </div>
          </>
        )}
      </div>

      <div style={{ padding: "18px 24px", borderTop: "1px solid #1a1a23", marginTop: 28, textAlign: "center" }}>
        <p style={{ margin: 0, fontSize: 10, color: "#444", fontFamily: "sans-serif" }}>
          Sammanställt utifrån partiernas officiella ståndpunkter, riksdagsmotioner och uttalanden 2025–2026. Betygen är redaktionella sammanfattningar — klicka på varje parti för fullständig motivering.
        </p>
      </div>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PartiKompass />);
  </script>
</body>
